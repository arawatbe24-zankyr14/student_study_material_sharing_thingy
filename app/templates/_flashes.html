{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flashes">
      {% for category, message in messages %}
        <p class="flash flash-{{ 'success' if category == 'success' else 'error' }}" role="{{ 'status' if category == 'success' else 'alert' }}">{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
