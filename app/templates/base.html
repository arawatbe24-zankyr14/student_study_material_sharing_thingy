<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Notes Hub{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>

  {% if current_user %}
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('main.dashboard') }}">Notes Hub</a>
      <nav class="nav" aria-label="Main">
        <a href="{{ url_for('main.dashboard') }}" {% if request.endpoint == 'main.dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
        <a href="{{ url_for('main.library') }}" {% if request.endpoint == 'main.library' %}aria-current="page"{% endif %}>Library</a>
        <a href="{{ url_for('main.upload') }}" {% if request.endpoint == 'main.upload' %}aria-current="page"{% endif %}>Upload</a>
      </nav>
      <div class="user-box">
        <span class="user-name">{{ current_user.name }}</span>
        <form method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="btn btn-ghost btn-small">Log out</button>
        </form>
      </div>
    </div>
  </header>
  {% endif %}

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <main id="main" class="{% block main_class %}container{% endblock %}">
    {% block flashes %}{% include "_flashes.html" %}{% endblock %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
